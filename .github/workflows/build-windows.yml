name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies
        run: npm ci

      - name: Download portable Node.js (win-x64)
        shell: pwsh
        run: |
          $nodeVer = node -p "process.versions.node"
          $url = "https://npmmirror.com/mirrors/node/v$nodeVer/node-v$nodeVer-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-tmp -Force
          New-Item -ItemType Directory -Force -Path node | Out-Null
          Copy-Item "node-tmp/node-v$nodeVer-win-x64/*" node/ -Recurse -Force
          if (-not (Test-Path "node/node.exe")) { throw "node.exe missing after extract" }
          & node/node.exe -v

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller RomMTranslator.spec --noconfirm --clean

      - name: Prepare Release folder
        shell: pwsh
        run: |
          $out = "release/RomMTranslator"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "dist/RomMTranslator/*" $out -Recurse -Force
          Copy-Item ".env.example" "$out/.env.example" -Force
          Copy-Item "README.md" "$out/README.md" -Force
          if (-not (Test-Path "$out/RomMTranslator.exe")) { throw "EXE not found" }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Zip artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "") { $tag = "dev" }
          $zip = "release/RomMTranslator-win64-$tag.zip"
          Compress-Archive -Path "release/RomMTranslator" -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomMTranslator-win64
          path: release/RomMTranslator-win64-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/RomMTranslator-win64-*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
